<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>羊毛伞 · UI 三稿对比</title>
  <style>
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#171816;color:#f6f4ec;overflow:hidden}.bar{height:74px;display:flex;align-items:center;gap:28px;padding:0 24px;border-bottom:1px solid #393a35;background:#171816}.identity{display:flex;align-items:center;gap:12px;white-space:nowrap}.mark{width:32px;height:32px;color:#ef8155}.identity strong{font-size:15px;letter-spacing:.12em}.identity span{display:block;color:#93968d;font:10px/1.5 monospace;letter-spacing:.14em;margin-top:2px}.tabs{display:flex;gap:6px;align-items:center;flex:1}.tabs button{border:1px solid transparent;background:none;color:#a9aca2;border-radius:8px;padding:10px 14px;font:inherit;font-size:13px;cursor:pointer;transition:.2s}.tabs button:hover{color:#fff;background:#252622}.tabs button.active{color:#171816;background:#f2f0e8}.tabs .num{font:10px monospace;margin-right:8px;opacity:.6}.open{display:flex;align-items:center;gap:18px}.hint{color:#777b71;font:10px monospace;white-space:nowrap}.open a{color:#d8dad1;text-decoration:none;font-size:12px;white-space:nowrap}.open a:hover{color:#fff}.frame{height:calc(100dvh - 74px);width:100%;border:0;display:block;background:#f6f4ee}button:focus-visible,a:focus-visible{outline:2px solid #ef8155;outline-offset:3px}@media(max-width:800px){.bar{height:auto;min-height:116px;padding:12px 14px;gap:10px;flex-wrap:wrap}.identity{flex:1}.identity span,.hint{display:none}.tabs{order:3;width:100%;gap:4px}.tabs button{flex:1;padding:9px 6px;font-size:12px}.tabs .num{margin-right:4px}.open a{font-size:11px}.frame{height:calc(100dvh - 116px)}}
  </style>
</head>
<body>
  <header class="bar">
    <div class="identity">
      <svg class="mark" viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M5 20C5 11.7 11.7 5 20 5s15 6.7 15 15c-3.4-2.3-6.7-2.3-10 0-3.3-2.3-6.7-2.3-10 0-3.3-2.3-6.6-2.3-10 0Z" stroke="currentColor" stroke-width="2.3"/><path d="M20 5v23.5c0 4.3 6.7 4.3 6.7 0" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/><path d="M10.5 10.5c2.2-2 5.1-3.2 8-3.5" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/></svg>
      <div><strong>羊毛伞 · UI 选稿</strong><span>THREE DIRECTIONS / ONE PRODUCT</span></div>
    </div>
    <nav class="tabs" aria-label="切换设计稿">
      <button class="active" data-demo="01-warm.html"><span class="num">01</span>羊毛手帖</button>
      <button data-demo="02-clear.html"><span class="num">02</span>晴朗桌面</button>
      <button data-demo="03-studio.html"><span class="num">03</span>夜间仪器</button>
    </nav>
    <div class="open"><span class="hint">按 1 / 2 / 3 切换</span><a id="open" href="01-warm.html" target="_blank" rel="noopener">单独打开 ↗</a></div>
  </header>
  <iframe class="frame" id="frame" src="01-warm.html" title="羊毛伞设计稿：羊毛手帖" allow="clipboard-write"></iframe>
  <script>
    const frame=document.querySelector('#frame'),open=document.querySelector('#open'),buttons=[...document.querySelectorAll('[data-demo]')];
    function select(index){buttons.forEach((b,i)=>b.classList.toggle('active',i===index));const file=buttons[index].dataset.demo;frame.src=file;frame.title='羊毛伞设计稿：'+buttons[index].textContent.trim();open.href=file;location.hash=String(index+1)}
    buttons.forEach((b,i)=>b.addEventListener('click',()=>select(i)));
    const initial=Math.min(2,Math.max(0,Number(location.hash.slice(1))-1||0));if(initial)select(initial);
    addEventListener('keydown',e=>{if(['1','2','3'].includes(e.key)&&!e.metaKey&&!e.ctrlKey)select(Number(e.key)-1)});
  </script>
</body>
</html>
