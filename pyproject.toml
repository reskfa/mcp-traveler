[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "mcp-traveler"
version = "0.1.0"
description = "Local A-share data gateway with MCP, configurable routing and field-level fallback"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "mcp>=1.20,<2", "httpx>=0.27,<1", "requests>=2.31", "python-dotenv>=1", "pandas>=2", "tushare>=1.4", "akshare>=1.17"]
[project.urls]
Homepage = "https://github.com/reskfa/mcp-traveler"
Issues = "https://github.com/reskfa/mcp-traveler/issues"
[project.optional-dependencies]
test = ["pytest>=8"]
[project.scripts]
mcp-traveler = "gateway.__main__:main"
[tool.setuptools.packages.find]
include = ["gateway*"]
[tool.setuptools.package-data]
gateway = ["static/*", "data/*.json"]
